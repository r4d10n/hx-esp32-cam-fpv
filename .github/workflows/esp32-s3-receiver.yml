name: ESP32-S3 Android Receiver - CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'esp32-s3-android-receiver/**'
      - '.github/workflows/esp32-s3-receiver.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'esp32-s3-android-receiver/**'

jobs:
  build-esp32s3:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest
    
    container:
      image: espressif/idf:v5.1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Verify ESP-IDF installation
        run: |
          echo "ESP-IDF version:"
          idf.py --version
          
      - name: Set target to ESP32-S3
        working-directory: esp32-s3-android-receiver
        run: |
          idf.py set-target esp32s3
          
      - name: Build firmware
        working-directory: esp32-s3-android-receiver
        run: |
          idf.py build
          
      - name: Check binary size
        working-directory: esp32-s3-android-receiver
        run: |
          BINARY=$(find build -name "*.bin" -type f | head -1)
          if [ -n "$BINARY" ]; then
            SIZE=$(stat -c%s "$BINARY")
            SIZE_MB=$((SIZE / 1048576))
            echo "Binary size: ${SIZE_MB}MB ($SIZE bytes)"
            
            if [ $SIZE -gt 4194304 ]; then
              echo "ERROR: Binary size exceeds 4MB limit"
              exit 1
            fi
          else
            echo "ERROR: No binary found"
            exit 1
          fi
          
      - name: Analyze build warnings
        working-directory: esp32-s3-android-receiver
        run: |
          idf.py build 2>&1 | tee build.log || true
          WARNINGS=$(grep -c "warning:" build.log || true)
          ERRORS=$(grep -c "error:" build.log || true)
          
          echo "Build Warnings: $WARNINGS"
          echo "Build Errors: $ERRORS"
          
          if [ $ERRORS -gt 0 ]; then
            echo "Build has errors!"
            exit 1
          fi
          
      - name: Generate memory usage report
        working-directory: esp32-s3-android-receiver
        run: |
          idf.py size || true
          
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v3
        with:
          name: esp32-s3-firmware
          path: |
            esp32-s3-android-receiver/build/*.bin
            esp32-s3-android-receiver/build/*.elf
          retention-days: 30
          
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs
          path: esp32-s3-android-receiver/build.log
          retention-days: 7

  component-tests:
    name: Component Unit Tests
    runs-on: ubuntu-latest
    needs: build-esp32s3
    
    container:
      image: espressif/idf:v5.1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Build component tests
        working-directory: esp32-s3-android-receiver
        run: |
          idf.py set-target esp32s3
          
          # Build tests for each component
          for component in components/*/test; do
            if [ -d "$component" ]; then
              echo "Building tests for $component"
              # Component test build would go here
            fi
          done
          
      - name: Run unit tests (emulated)
        working-directory: esp32-s3-android-receiver
        run: |
          echo "Unit tests would run here with QEMU or native tests"
          # Note: Actual test execution requires QEMU setup
          
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run clang-format check
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          
          # Check C/C++ formatting
          find esp32-s3-android-receiver -name "*.c" -o -name "*.h" -o -name "*.cpp" | \
            xargs clang-format --dry-run --Werror || true
            
      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for TODO/FIXME comments..."
          grep -r "TODO\|FIXME" esp32-s3-android-receiver/ --include="*.c" --include="*.h" || true

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-esp32s3, component-tests]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download firmware artifacts
        uses: actions/download-artifact@v3
        with:
          name: esp32-s3-firmware
          path: ./firmware
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            firmware/*.bin
            firmware/*.elf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
