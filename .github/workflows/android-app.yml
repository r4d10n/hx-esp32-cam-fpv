name: Android FPV Viewer - CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'esp32-s3-android-receiver/android/**'
      - '.github/workflows/android-app.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'esp32-s3-android-receiver/android/**'

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        working-directory: esp32-s3-android-receiver/android
        run: chmod +x gradlew || true
        
      - name: Run lint
        working-directory: esp32-s3-android-receiver/android
        run: ./gradlew lint || echo "Lint step requires full Android project"
        
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lint-results
          path: esp32-s3-android-receiver/android/app/build/reports/lint-results*.html
          retention-days: 7

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        working-directory: esp32-s3-android-receiver/android
        run: chmod +x gradlew || true
        
      - name: Run unit tests
        working-directory: esp32-s3-android-receiver/android
        run: ./gradlew test || echo "Test step requires full Android project"
        
      - name: Generate test report
        if: always()
        working-directory: esp32-s3-android-receiver/android
        run: ./gradlew jacocoTestReport || true
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            esp32-s3-android-receiver/android/app/build/reports/tests/
            esp32-s3-android-receiver/android/app/build/test-results/
          retention-days: 7
          
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: esp32-s3-android-receiver/android/app/build/reports/jacoco/
          retention-days: 7

  instrumented-tests:
    name: Instrumented Tests
    runs-on: macos-latest  # macOS for hardware acceleration
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        working-directory: esp32-s3-android-receiver/android
        run: chmod +x gradlew || true
        
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            cd esp32-s3-android-receiver/android
            ./gradlew connectedAndroidTest || echo "Instrumented tests require full project"
            
      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: instrumented-test-results
          path: esp32-s3-android-receiver/android/app/build/reports/androidTests/
          retention-days: 7

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        working-directory: esp32-s3-android-receiver/android
        run: chmod +x gradlew || true
        
      - name: Build debug APK
        working-directory: esp32-s3-android-receiver/android
        run: ./gradlew assembleDebug || echo "Build requires full Android project"
        
      - name: Check APK size
        working-directory: esp32-s3-android-receiver/android
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(stat -c%s "$APK")
            SIZE_MB=$((SIZE / 1048576))
            echo "APK size: ${SIZE_MB}MB ($SIZE bytes)"
            
            if [ $SIZE -gt 52428800 ]; then
              echo "WARNING: APK size exceeds 50MB"
            fi
          fi
          
      - name: Upload debug APK
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: esp32-s3-android-receiver/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, instrumented-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: Grant execute permission for gradlew
        working-directory: esp32-s3-android-receiver/android
        run: chmod +x gradlew || true
        
      - name: Build release APK
        working-directory: esp32-s3-android-receiver/android
        run: ./gradlew assembleRelease || echo "Release build requires signing config"
        
      - name: Sign APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: esp32-s3-android-receiver/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
          
      - name: Upload release APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: esp32-s3-android-receiver/android/app/build/outputs/apk/release/*.apk
          retention-days: 90

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [build-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download release APK
        uses: actions/download-artifact@v3
        with:
          name: release-apk
          path: ./apk
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
