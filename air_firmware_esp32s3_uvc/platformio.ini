; PlatformIO Project Configuration File
;
; ESP32-S3 USB UVC Camera Firmware
; Streams camera as USB Video Class device
;
; Connect ESP32-S3 to computer via USB and it appears as a webcam

[platformio]
src_dir = main

[env:esp32s3_uvc]
platform = espressif32@6.9.0
framework = espidf

board = seeed_xiao_esp32s3

build_flags =
    -DBOARD_XIAOS3SENSE
    -DUSB_UVC_MODE

monitor_speed = 115200
monitor_raw = yes

build_type = release

lib_extra_dirs =
    ../components/esp32-camera/
    ../components/uvc_device/

board_build.partitions = partitions.csv

; For ESP32-S3 USB OTG
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; Monitor via UART (USB is used for UVC)
monitor_dtr = 0
monitor_rts = 0
